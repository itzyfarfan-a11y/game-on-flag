<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game On Flag · Captura de playoffs</title><style>
:root{font-family:Arial,sans-serif;color:#18324b;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}.head{background:#17233b;color:#fff;padding:22px 18px}.head b{font-size:22px}.head p{margin:6px 0 0;color:#d5ddec}.wrap{max-width:760px;margin:auto;padding:16px}.notice,.game{background:#fff;border:1px solid #d9e2ee;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 4px 12px #102a4a0d}.notice{background:#edf4ff}.gamehead{display:flex;justify-content:space-between;gap:8px;align-items:center;color:#65778d;font-size:13px;font-weight:bold}.team{display:grid;grid-template-columns:1fr 82px;gap:10px;align-items:center;margin-top:12px;padding:10px;background:#f5f7fb;border-radius:12px;font-weight:800}.team input{width:100%;padding:10px;border:1px solid #cbd6e4;border-radius:9px;text-align:center;font-size:24px;font-weight:900;color:#172b46}.meta{font-size:13px;color:#66778c;margin-top:12px}.btn{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;background:#e8bd45;color:#1d2633;font-size:16px;font-weight:900}.btn:disabled{opacity:.55}.empty{padding:25px;text-align:center;color:#65778d}.status{padding:12px;border-radius:10px;margin:12px 0;background:#fff;border:1px solid #d9e2ee}.error{color:#a21e36}.success{color:#17633b}
</style></head><body><header class="head"><b>🏈 GAME ON FLAG</b><p>Captura oficial de resultados · Playoffs</p></header><main class="wrap"><div id="status" class="status">Validando enlace…</div><div id="games"></div></main><script>
const API='https://picivrqgmckrwutarhyw.supabase.co/functions/v1/referee-results-capture',KEY='sb_publishable_SK8XBpzn3b5Dr-qa2rO7Nw_un7KbvCl',token=new URLSearchParams(location.search).get('token')||'',status=document.getElementById('status'),games=document.getElementById('games');
async function call(body){const r=await fetch(API,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({...body,token})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'No se pudo completar la operación');return j}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){if(!token)throw Error('Falta el enlace de acceso. Solicita uno nuevo a la administración.');const j=await call({action:'list_playoffs'});status.textContent='Torneo: '+j.tournament.name+' · Captura de playoffs';status.className='status success';if(!j.matches.length){games.innerHTML='<div class="empty">Todavía no hay partidos de playoffs generados.</div>';return}games.innerHTML=j.matches.map(m=>{const ready=m.team_a_id&&m.team_b_id,done=!!m.winner_team_id;return '<article class="game"><div class="gamehead"><span>'+esc(m.category_name)+' · '+esc(m.stage)+' · Juego '+esc(m.match_order)+'</span><span>'+(done?'RESULTADO GUARDADO':'PENDIENTE')+'</span></div><div class="team"><span>'+esc(m.team_a_name)+'</span><input type="number" min="0" step="1" inputmode="numeric" id="a_'+m.id+'" value="'+(m.score_a??'')+'" placeholder="—" '+(!ready?'disabled':'')+'></div><div class="team"><span>'+esc(m.team_b_name)+'</span><input type="number" min="0" step="1" inputmode="numeric" id="b_'+m.id+'" value="'+(m.score_b??'')+'" placeholder="—" '+(!ready?'disabled':'')+'></div><div class="meta">📅 '+esc(m.match_date||'Fecha por definir')+' · 🕒 '+esc(m.match_time?String(m.match_time).slice(0,5):'Hora por definir')+' · 📍 '+esc(m.field_name||'Campo por definir')+'</div><button class="btn" onclick="save(\''+m.id+'\')" '+(!ready?'disabled':'')+'>💾 Guardar resultado</button></article>'}).join('')}
async function save(id){const a=document.getElementById('a_'+id).value,b=document.getElementById('b_'+id).value;if(a===''||b===''||!/^\d+$/.test(a)||!/^\d+$/.test(b)||Number(a)===Number(b)){alert('Captura ambos marcadores. No se permiten empates en playoffs.');return}const btn=document.querySelector('button[onclick="save(\''+id+'\')"]');if(btn)btn.disabled=true;try{await call({action:'save_playoff',match_id:id,score_a:Number(a),score_b:Number(b)});status.textContent='Resultado guardado correctamente. El bracket se actualizará.';status.className='status success';await load()}catch(e){alert(e.message);if(btn)btn.disabled=false}}
load().catch(e=>{status.textContent=e.message;status.className='status error'});
</script></body></html>
