<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAME ON FLAG — Roster del Coach</title>
<style>
:root{--bg:#07070b;--card:#15121d;--line:#382e48;--purple:#7d22ff;--gold:#e6c04d;--txt:#fff;--mut:#aaa4b7;--red:#ff6378}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#35105f,#07070b 48%);color:var(--txt);font-family:Arial,sans-serif}.app{max-width:720px;margin:auto;padding:16px}.brand{text-align:center;font-weight:900;font-size:25px;margin:12px 0 2px}.sub{text-align:center;letter-spacing:3px;color:var(--mut);font-size:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}.hero{border:2px solid var(--purple)}h1{font-size:25px;margin:0 0 5px}h2{font-size:19px;margin:0 0 10px}.mut{color:var(--mut)}.form{display:grid;gap:10px}input,button{font:inherit;border-radius:11px;padding:13px;border:1px solid var(--line)}input{width:100%;background:#0b0a0f;color:#fff}.gold{background:var(--gold);color:#17120a;font-weight:900;border:0}.primary{background:var(--purple);color:#fff;font-weight:900;border:0}.danger{background:#6f1e35;color:#fff;border:0}.player{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px}.player img{width:58px;height:58px;object-fit:cover;border-radius:10px;background:#0b0a0f}.player button{padding:9px;background:#292333;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.error{color:#ff9aaa}.ok{color:#7ff0b1}.count{display:inline-block;background:#292333;padding:5px 9px;border-radius:99px;color:#f2c94c}
</style></head><body><main class="app"><div class="brand">GAME ON FLAG</div><div class="sub">ROSTER DEL COACH</div><section id="loading" class="card hero">Cargando enlace...</section><section id="app" class="hidden">
<section class="card hero"><h1 id="team">Equipo</h1><div id="meta" class="mut"></div><p class="mut">Código de acceso válido para este equipo y categoría.</p></section>
<section class="card"><h2>👥 Jugadores <span id="count" class="count">0/18</span></h2><div id="players"></div><div class="actions" style="margin-top:12px"><button class="primary" onclick="addPlayer()">➕ Agregar jugador</button><button class="gold" onclick="saveRoster()">💾 Guardar roster</button></div><div id="msg" class="mut" style="margin-top:10px"></div></section>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://picivrqgmckrwutarhyw.supabase.co',SUPABASE_ANON_KEY='sb_publishable_SK8XBpzn3b5Dr-qa2rO7Nw_un7KbvCl';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const token=new URLSearchParams(location.search).get('token');let info=null,players=[];
function msg(t,c='mut'){const e=document.getElementById('msg');e.className=c;e.textContent=t}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){document.getElementById('count').textContent=players.length+'/18';document.getElementById('players').innerHTML=players.map((p,i)=>`<div class="player"><img src="${esc(p.photo_url||'')}" onerror="this.style.visibility='hidden'"><div><b>${esc(p.full_name||'')}</b><div class="mut">Jersey #${esc(p.jersey_number??'')}</div></div><button onclick="editPlayer(${i})">✏️</button></div>`).join('')||'<div class="mut">Aún no hay jugadores.</div>'}
function addPlayer(){if(players.length>=18)return alert('El roster no puede tener más de 18 jugadores.');players.push({full_name:'',jersey_number:'',photo_url:'',date_of_birth:'',curp:''});editPlayer(players.length-1)}
function editPlayer(i){const p=players[i];const n=prompt('Nombre completo:',p.full_name||'');if(n===null)return;const j=prompt('Número de jersey (0-99):',p.jersey_number??'');if(j===null)return;const photo=prompt('Foto / URL:',p.photo_url||'');if(photo===null)return;p.full_name=n.trim();p.jersey_number=j.trim();p.photo_url=photo.trim();render()}
async function saveRoster(){if(!players.length)return alert('Agrega al menos un jugador.');for(const p of players){if(!p.full_name||!/^[0-9]+$/.test(String(p.jersey_number))||!p.photo_url)return alert('Cada jugador necesita nombre, número y foto/URL.')}const nums=players.map(p=>Number(p.jersey_number));if(new Set(nums).size!==nums.length)return alert('No puede haber números de jersey repetidos.');msg('Guardando...');const {data,error}=await sb.rpc('submit_roster_with_access_link',{p_token:token,p_players:players});if(error){msg(error.message,'error');return}msg((data?.message||'Roster guardado correctamente')+'.','ok')}
async function load(){if(!token){document.getElementById('loading').innerHTML='<b class="error">Falta el código de acceso.</b>';return}const {data,error}=await sb.rpc('get_roster_with_access_link',{p_token:token});if(error){document.getElementById('loading').innerHTML='<b class="error">Enlace inválido o cerrado.</b><br><span class="mut">'+esc(error.message)+'</span>';return}info=data;players=(data.players||[]).map(p=>({...p}));document.getElementById('loading').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('team').textContent=data.team||'Equipo';document.getElementById('meta').textContent=(data.category||'Categoría');render()}
load();
</script></body></html>
